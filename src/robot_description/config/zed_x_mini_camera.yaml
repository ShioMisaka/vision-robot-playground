camera:
  name: "zed_x_mini"
  mount_frame: "panda_hand"
  camera_frame: "camera_link"
  optical_frame: "camera_color_optical_frame"

  intrinsics:
    # Isaac Sim 参数: focal_length=2.208, h_aperture=5.76, v_aperture=3.24, resolution=1280x720
    # fx = focal_length * width  / h_aperture = 2.208 * 1280 / 5.76
    # fy = focal_length * height / v_aperture = 2.208 * 720  / 3.24
    # cx = width  / 2
    # cy = height / 2
    fx: 490.6666666666667
    fy: 490.6666666666667
    cx: 640.0
    cy: 360.0

  extrinsics:
    # panda_hand → camera_link（来源: URDF panda_hand_camera_joint）
    # <origin rpy="3.14159265359 0 -1.57079632679" xyz="0.025 -0.015 0.015"/>
    offset_xyz: [0.025, -0.015, 0.015]
    rpy: [3.14159265359, 0.0, -1.57079632679]

  optical_frame_rotation:
    # camera_link → camera_color_optical_frame
    # USD 相机 (X-right, Y-up, Z-back) → ROS 光学 (X-right, Y-down, Z-front): Ry(π)
    pitch: 3.14159265359
